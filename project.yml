name: Sieve
options:
  bundleIdPrefix: com.arlo
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.6"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  Sieve:
    type: application
    platform: macOS
    # Signing lives in Signing.xcconfig (ad-hoc by default; drop in a local
    # Signing.local.xcconfig to sign with a real identity — see that file).
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Sieve
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - package: GRDB
        product: GRDB
    info:
      path: Sieve/Resources/Info.plist
      properties:
        CFBundleName: Sieve
        CFBundleDisplayName: Sieve
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: ""
        LSMinimumSystemVersion: "26.0"
    entitlements:
      path: Sieve/App/Sieve.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arlo.Sieve
        CODE_SIGN_ENTITLEMENTS: Sieve/App/Sieve.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SieveTests:
    type: bundle.unit-test
    platform: macOS
    sources: [SieveTests]
    dependencies:
      - target: Sieve
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arlo.SieveTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Sieve:
    build:
      targets:
        Sieve: all
        SieveTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [SieveTests]
